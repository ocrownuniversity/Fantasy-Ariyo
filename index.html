.authbg #root>main>p.mute{color:#cfe6da;font-size:15px}

header{background:linear-gradient(90deg,#0b5d3b,#08452c);box-shadow:0 2px 8px rgba(0,0,0,.2)}
nav{box-shadow:0 -2px 10px rgba(0,0,0,.2)}nav button{line-height:1.1;padding:8px 2px 9px}
button.b{border-radius:10px;padding:10px 15px;transition:transform .08s}button.b:active{transform:scale(.97)}

Gabriel|Arsenal|DEF|11;Saliba|Arsenal|DEF|11;Van Dijk|Liverpool|DEF|11.5;Gvardiol|Man City|DEF|10.5;Trent|Liverpool|DEF|12;Porro|Tottenham|DEF|9;Gusto|Chelsea|DEF|8.5;Robertson|Liverpool|DEF|9.5;Lacroix|Crystal Palace|DEF|8;Pedro Porro|Tottenham|DEF|8.5;Mykolenko|Everton|DEF|6.5;Dalot|Man United|DEF|7

Haaland|Man City|FWD|28;Isak|Newcastle|FWD|20;Watkins|Aston Villa|FWD|17;Havertz|Arsenal|FWD|15;Jackson|Chelsea|FWD|13;Solanke|Tottenham|FWD|14;Wood|Nottm Forest|FWD|12;Calvert-Lewin|Everton|FWD|10`;
const PLAYERS=SEED.split(/[;\n]/).filter(Boolean).map((s,i)=>{const[n,c,p,pr]=s.split("|");return{id:"p"+i,name:n,club:c,pos:p,price:+pr,form:0,pts:0,sel:0,st:"a",min:0,ti:0,to:0}});

/* ================= RULES ENGINE ================= */
function playerPoints(pos,s,captain){ // s: {min,goals,assists,cs,yc,rc,og,pensSaved,postponed}
  if(s.postponed) return captain?2:1;
  if(!s.min) return 0;
  let p=s.min>=60?2:1; p-=s.yc||0; p-=3*(s.rc||0); p-=2*(s.og||0);
  const g=pos==="FWD"?10:pos==="MID"?8:12, a=pos==="FWD"?5:6, cs=pos==="MID"?2:(pos==="DEF"||pos==="GK")?5:0;
  p+=g*(s.goals||0)+a*(s.assists||0)+(s.cs?cs:0)+(pos==="GK"?6*(s.pensSaved||0):0);
  return captain?p*2:p;
}
function prizeTable(gross){return[.25,.10,.05,.025,.025,.025,.025,.025,.025,.025].map(r=>Math.round(gross*r))} // 25+10+5+7*2.5=57.5%
function distribute(scores,table){ // scores sorted desc [{id,pts}] -> prize per id; ties share combined prizes and skip occupied ranks
  const out={};let i=0;
  while(i<scores.length&&i<10){let j=i;while(j+1<scores.length&&scores[j+1].pts===scores[i].pts)j++;
    let pool=0;for(let k=i;k<=j&&k<10;k++)pool+=table[k]||0;const share=Math.floor(pool/(j-i+1));
    for(let k=i;k<=j;k++)out[scores[k].id]=share;i=j+1}
  return out;
}
const lineupOK=(ids,xi)=>{const c={GK:0,DEF:0,MID:0,FWD:0};xi.forEach(id=>c[PLAYERS.find(p=>p.id===id).pos]++);return xi.length===11&&c.GK===1&&c.DEF>=3&&c.MID>=2&&c.FWD>=1}


const pp=(id,live,cap)=>{const p=PLAYERS.find(x=>x.id===id),s=live&&live.stats&&live.stats[id];return p&&s?playerPoints(p.pos,{min:s[0],goals:s[1],assists:s[2],cs:s[3],yc:s[4],rc:s[5],og:s[6],pensSaved:s[7]},cap):0};
const entryPts=(e,live)=>(e.xi||[]).reduce((t,id)=>t+pp(id,live,id===e.cap),0);
const showPts=(e,live)=>e.adj?e.pts:(live&&live.gw===e.gw?entryPts(e,live):(e.pts||0));
const toLocal=s=>{const d=new Date(s);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
/* Free football data: official Fantasy Premier League public API (no key). It has no CORS header, so the browser reaches it via free CORS proxies; if all fail, admin can paste the JSON. */
async function fpl(path){const url="https://fantasy.premierleague.com/api/"+path;
  const px=[u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+u];
  for(const p of px){try{const r=await fetch(p(url));if(r.ok)return await r.json()}catch(e){}}
  throw Error("Free CORS proxies are unreachable right now. Use 'Paste JSON' below, or try again later.")}
/* Price algorithm (documented): among players who have played, rise +0.1 if net transfers-in this round is in the top 5% and form is at/above median; fall -0.1 if net transfers are in the bottom 5% (negative) and form is at/below median. Manually edited prices are skipped. Uses real API fields only. */
function priceMoves(P,cfg){const act=P.filter(p=>p.min>0);if(act.length<20)return[];
  const nets=act.map(p=>p.ti-p.to).sort((a,b)=>a-b),hi=nets[Math.floor(nets.length*.95)],lo=nets[Math.floor(nets.length*.05)];
  const f=act.map(p=>p.form).sort((a,b)=>a-b),mid=f[Math.floor(f.length/2)];
  return P.filter(p=>p.min>0&&!(cfg.manual||{})[p.id]).map(p=>{const n=p.ti-p.to;let d=0;if(n>0&&n>=hi&&p.form>=mid)d=.1;else if(n<0&&n<=lo&&p.form<=mid&&p.price>3.5)d=-.1;return d?{p,d}:null}).filter(Boolean)}

/* ================= DATA LAYER (Firebase or demo) ================= */
let fb=null;
if(FIREBASE_CONFIG&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);fb={a:firebase.auth(),d:firebase.firestore()}}
const LS={g:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const blank=(name,email,dob)=>({name,email,dob,wallet:0,reserved:0,tx:[],deposits:[],withdrawals:[],squad:null,entries:[],freeUsed:false,suspended:false,limits:{d:0,w:0,m:0},excluded:null,created:Date.now()});
const API={

    if(LS.g("op_u_"+email))throw Error("An account with this email already exists.");

/* Image compressor: resizes (max 1000px) and lowers JPEG quality, then size, until under ~150 KB so it fits Firestore comfortably */
function compress(file,max=200000){return new Promise((res,rej)=>{const img=new Image(),r=new FileReader();r.onerror=()=>rej(Error("Could not read file"));
  r.onload=()=>{img.onload=()=>{let w=Math.min(1000,img.width),q=.7;const draw=()=>{const c=document.createElement("canvas");c.width=w;c.height=Math.round(img.height*w/img.width);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)};
    let d=draw();while(d.length>max&&(q>.31||w>400)){if(q>.31)q-=.1;else w=Math.round(w*.8);d=draw()}
    d.length>max?rej(Error("Image is too detailed to compress enough. Use a screenshot of the receipt.")):res(d)};img.onerror=()=>rej(Error("That file is not a valid image."));img.src=r.result};r.readAsDataURL(file)})}
const age=d=>{const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};

/* ================= APP ================= */
function App(){
  const[user,setUser]=useState(undefined),[st,setSt]=useState(null),[admin,setAdmin]=useState(false),[cfg,setCfg]=useState(null),[D,setD]=useState(null),[err,setErr]=useState(""),[tab,setTab]=useState("home");
  const reload=()=>Promise.all([API.cfg(),API.doc("players",{list:[]}),API.doc("gws",{list:[]}),API.doc("live",{gw:0,stats:{}}),API.doc("lb",{rows:[],overall:[]})]).then(([c,pl,g,lv,lb])=>{if(pl.list.length)PLAYERS.splice(0,PLAYERS.length,...pl.list);setCfg(c);setD({gws:g.list,live:lv,lb})}).catch(e=>setErr("Could not load game data: "+e.message));
  useEffect(()=>API.restore(u=>setUser(u)),[]);
  useEffect(()=>{setErr("");if(!user){setSt(null);setAdmin(false);return}
    (async()=>{try{let x=await API.load(user.uid);if(!x){x=blank((fb&&fb.a.currentUser&&fb.a.currentUser.displayName)||user.email.split("@")[0],user.email,"");await API.save(user.uid,x)}setSt(x)}catch(e){setErr("Could not load your account: "+e.message)}})();API.isAdmin(user).then(setAdmin).catch(()=>setAdmin(false));reload()},[user]);
  useEffect(()=>{const m={name:"OPLAYING",short_name:"OPLAYING",start_url:".",display:"standalone",background_color:"#0b5d3b",theme_color:"#0b5d3b",icons:[{src:"data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#0b5d3b'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='#f4c20d' font-family='sans-serif' font-weight='bold'>O</text></svg>"),sizes:"512x512",type:"image/svg+xml"}]};const l=document.createElement("link");l.rel="manifest";l.href="data:application/json,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l)},[]);

  if(!st||!cfg||!D)return <main>Loading your account…</main>;
  if(st.suspended)return <main><div className="card"><h2>Account suspended</h2><p>Contact support@oplaying.com.</p><button className="b" onClick={()=>API.out().then(()=>setUser(null))}>Log out</button></div></main>;
  const P=PLAYERS.map(p=>({...p,price:cfg.prices[p.id]??p.price}));
  const ICON={home:"🏠",squad:"👕",play:"🏆",board:"📊",wallet:"💰",info:"📖",admin:"⚙️"};
  const tabs=[["home","Home"],["squad","Squad"],["play","Play"],["board","Ranks"],["wallet","Wallet"],["info","Rules"],...(admin?[["admin","Admin"]]:[])];
  const lock=cfg.kickoff?new Date(new Date(cfg.kickoff).getTime()-30*60000):null, locked=lock&&Date.now()>=lock.getTime();
  const props={st,update,P,cfg,setCfg,user,locked,lock,setTab,D,reload};
  return <>
    <header><div className="logo">O<b>PLAYING</b></div><div className="row"><span style={{fontSize:13}}>{st.name.split(" ")[0]} · {naira(st.wallet-st.reserved)}</span><button className="b y" onClick={()=>API.out().then(()=>setUser(null))}>Log out</button></div></header>
    <main>
      {!fb&&<div className="warn"><b>Demo mode.</b> No Firebase config yet, so data is saved in this browser only. Paste your config at the top of index.html to go live.</div>}
      {!REAL_MONEY_ENABLED&&<div className="warn"><b>Real-money features are switched off.</b> Deposits, entries and withdrawals here use test credits only until secure server-side handling and licensing are in place.</div>}
      {tab==="home"&&<Home {...props}/>}{tab==="squad"&&<Squad {...props}/>}{tab==="play"&&<Play {...props}/>}
      {tab==="board"&&<Board {...props}/>}{tab==="wallet"&&<Wallet {...props}/>}{tab==="info"&&<Info/>}{tab==="admin"&&admin&&<Admin {...props}/>}
    </main>
    <nav>{tabs.map(([k,l])=><button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}><span style={{fontSize:19,display:"block"}}>{ICON[k]}</span>{l}</button>)}</nav>
  </>

function Auth({onDone}){

    await API.setDoc("players",{list,t:Date.now()});
    const kick={},last={};(fix||[]).forEach(f=>{if(f.event&&f.kickoff_time){if(!kick[f.event]||f.kickoff_time<kick[f.event])kick[f.event]=f.kickoff_time;if(!last[f.event]||f.kickoff_time>last[f.event])last[f.event]=f.kickoff_time}});
    const old=D.gws,gws=boot.events.map(ev=>{const o=old.find(x=>x.id===ev.id)||{};return{id:ev.id,deadline:ev.deadline_time,finished:ev.finished,kick:kick[ev.id]||o.kick||null,last:last[ev.id]||o.last||null}});
    await API.setDoc("gws",{list:gws});const g=gws.find(x=>!x.finished);
    await saveCfg({...cfg,gw:g?g.id:cfg.gw,kickoff:g&&g.kick?g.kick:cfg.kickoff});await reload();return "Imported "+list.length+" players and "+gws.length+" Gameweeks. Your manual prices were kept."};
  const applyLive=async lv=>{const stats={};lv.elements.forEach(x=>{const s=x.stats;stats["p"+x.id]=[s.minutes,s.goals_scored,s.assists,s.clean_sheets,s.yellow_cards,s.red_cards,s.own_goals,s.penalties_saved]});await API.setDoc("live",{gw:cfg.gw,stats,t:Date.now()});await reload();return "Live stats saved for Gameweek "+cfg.gw};
  const importAll=()=>run(async()=>applyBoot(await fpl("bootstrap-static/"),await fpl("fixtures/")));
  const doLive=()=>run(async()=>applyLive(await fpl("event/"+cfg.gw+"/live/")));
  const doPaste=()=>run(async()=>{const j=JSON.parse(paste);if(kind==="bootstrap")return applyBoot(j,null);if(kind==="fixtures"){const gws=D.gws.map(g=>{const f=j.filter(x=>x.event===g.id&&x.kickoff_time).map(x=>x.kickoff_time).sort();return f.length?{...g,kick:f[0],last:f[f.length-1]}:g});await API.setDoc("gws",{list:gws});await reload();return "Fixtures applied."}return applyLive(j)});
  const publish=()=>run(async()=>{const lvd=await API.doc("live",{gw:0,stats:{}}),all=await API.all();let n=0;const R=[],tot={};
    for(const u of all){const st=JSON.parse(JSON.stringify(u.st));let ch=false;
      st.entries.forEach(e=>{if(!(e.adj&&(cfg.scoreLog||[]).some(l=>l.entry===e.id))&&e.gw===lvd.gw){const p=entryPts(e,lvd);if(p!==e.pts){e.pts=p;ch=true;n++}}tot[st.name]=(tot[st.name]||0)+(e.pts||0);if(e.gw===cfg.gw)R.push({id:e.id,baller:st.name,team:e.team,level:e.level,pts:e.pts||0})});
      if(ch)await API.save(u.uid,st)}
    LEVELS.forEach(L=>{const es=R.filter(r=>r.level===L.id).sort((a,b)=>b.pts-a.pts),gross=Math.max(es.length*L.fee,(cfg.minPool||{})[L.id]||0),d=distribute(es,prizeTable(gross));es.forEach(r=>r.prize=d[r.id]||0)});
    R.sort((a,b)=>b.pts-a.pts);const overall=Object.entries(tot).map(([baller,pts])=>({baller,pts})).sort((a,b)=>b.pts-a.pts).slice(0,100);
    await API.setDoc("lb",{gw:cfg.gw,rows:R.slice(0,300),overall,t:Date.now()});await reload();await load();return "Recalculated "+n+" entries and published the leaderboard."});
  const autoPrice=()=>run(async()=>{const mv=priceMoves(P,cfg);if(!mv.length)return "No price changes today (not enough data or no player met the rules).";
    const prices={...cfg.prices},log=[...(cfg.priceLog||[])];mv.forEach(({p,d})=>{const nw=+(p.price+d).toFixed(1);prices[p.id]=nw;log.unshift({id:p.id,name:p.name,prev:p.price,now:nw,diff:d,d:Date.now(),auto:true})});
    await saveCfg({...cfg,prices,priceLog:log.slice(0,300)});return mv.length+" prices changed ("+mv.filter(x=>x.d>0).length+" up, "+mv.filter(x=>x.d<0).length+" down)."});
  /* requests */
  const dep=(uid,id,ok)=>mod(uid,s=>{const d=s.deposits.find(x=>x.id===id);if(d.status!=="pending")return s;d.status=ok?"approved":"rejected";if(ok){s.wallet+=d.a;s.tx.unshift({t:"Deposit approved",a:d.a,d:Date.now()})}return s});
  const wdr=(uid,id,act)=>mod(uid,s=>{const w=s.withdrawals.find(x=>x.id===id);
    if(act==="approve"&&w.status==="pending")w.status="approved";
    else if(act==="reject"&&(w.status==="pending"||w.status==="approved")){w.status="rejected";s.reserved-=w.a}
    else if(act==="paid"&&w.status==="approved"){w.status="paid";s.reserved-=w.a;s.wallet-=w.a;s.tx.unshift({t:"Withdrawal paid",a:-w.a,d:Date.now()})}return s});
  const setPrice=(p,v)=>{v=+v;if(!v||v===p.price)return;const log=[{id:p.id,name:p.name,prev:p.price,now:v,diff:+(v-p.price).toFixed(1),d:Date.now()},...(cfg.priceLog||[])].slice(0,300);saveCfg({...cfg,prices:{...cfg.prices,[p.id]:v},manual:{...cfg.manual,[p.id]:true},priceLog:log})};
  const setPts=(uid,id,v)=>{mod(uid,s=>{const e=s.entries.find(x=>x.id===id);e.pts=+v;e.adj=true;return s});saveCfg({...cfg,scoreLog:[{uid,entry:id,pts:+v,d:Date.now()},...(cfg.scoreLog||[])].slice(0,200)})};
  const viewRc=(uid,d)=>{const w=window.open("","_blank");const show=x=>{w&&w.document.write(x?'<img style="max-width:100%" src="'+x+'">':"Receipt not found")};
    if(typeof d.rc==="string"&&d.rc.startsWith("data:"))show(d.rc);else API.getReceipt(uid+"_"+d.id).then(r=>show(r&&r.data)).catch(()=>show(null))};
  const rows=users.flatMap(u=>u.st.entries.map(e=>({u,e})));
  /* prizes */
  const gwRows=rows.filter(r=>r.e.gw===cfg.gw);
  const gwo=D.gws.find(g=>g.id===cfg.gw),ready=!gwo||!gwo.last||Date.now()>=new Date(gwo.last).getTime()+3*36e5;
  const lvl=LEVELS.map(L=>{const es=gwRows.filter(r=>r.e.level===L.id).map(r=>({...r,id:r.e.id,pts:r.e.pts||0})).sort((a,b)=>b.pts-a.pts);const gross=Math.max(es.length*L.fee,(cfg.minPool||{})[L.id]||0),tb=prizeTable(gross);return{L,es,gross,tb,pool:tb.reduce((a,b)=>a+b,0),d:distribute(es,tb),done:(cfg.final||{})[cfg.gw+"-"+L.id]}});
  const approve=x=>run(async()=>{if(!ready&&!confirm("Matches may not be finished. Credit prizes anyway?"))return "Cancelled.";
    const all=await API.all(),by={};x.es.forEach(r=>{const p=x.d[r.id];if(p)by[r.uid]=(by[r.uid]||0)+p});let t=0;
    for(const u of all){if(by[u.uid]){const st=JSON.parse(JSON.stringify(u.st));st.wallet+=by[u.uid];st.tx.unshift({t:"Prize GW"+cfg.gw+" "+x.L.id,a:by[u.uid],d:Date.now()});await API.save(u.uid,st);t+=by[u.uid]}}
    await saveCfg({...cfg,final:{...cfg.final,[cfg.gw+"-"+x.L.id]:{t:Date.now(),total:t}}});await load();return "Credited "+naira(t)+" to winners."});
  /* reports */
  const sum=f=>users.reduce((t,u)=>t+f(u.st),0);
  const fees=sum(s=>s.entries.reduce((t,e)=>t+(e.fee??LEVELS.find(l=>l.id===e.level).fee),0)),deps=sum(s=>s.deposits.filter(d=>d.status==="approved").reduce((t,d)=>t+d.a,0)),wds=sum(s=>s.withdrawals.filter(w=>w.status==="paid").reduce((t,w)=>t+w.a,0)),won=sum(s=>s.tx.filter(t=>t.t.startsWith("Prize")).reduce((t,x)=>t+x.a,0));
  const T=[["data","Data"],["req","Requests"],["users","Users"],["gw","Gameweeks"],["price","Prices"],["score","Scoring"],["prize","Prizes"],["rep","Reports"]];
  const Btn=({f,children,y})=><button className={"b "+(y?"y":"")} disabled={busy} onClick={f}>{children}</button>;
  return <><h1>Super Admin</h1><div className="row" style={{marginBottom:10}}>{T.map(([k,l])=><button key={k} className={"b "+(sub===k?"":"g")} onClick={()=>setSub(k)}>{l}</button>)}</div>
  {msg&&<div className="warn">{msg}</div>}
  {sub==="data"&&<><div className="card"><h3>Football data (free FPL API)</h3><p className="mute">{PLAYERS.length} players loaded · {D.gws.length} Gameweeks · active GW {cfg.gw}. Imports keep your manual prices.</p>
    <div className="row"><Btn y f={importAll}>1. Import players, fixtures &amp; Gameweeks</Btn><Btn f={doLive}>2. Load live points (GW {cfg.gw})</Btn><Btn f={publish}>3. Recalculate &amp; publish leaderboard</Btn><Btn f={autoPrice}>Run price update</Btn></div></div>
    <div className="card"><h3>Paste JSON (if the proxies fail)</h3><p className="mute">Open the FPL URL in your browser, copy all the text, paste here. bootstrap-static/ · fixtures/ · event/{"{gw}"}/live/ on fantasy.premierleague.com/api/</p>
      <select value={kind} onChange={e=>setKind(e.target.value)}><option value="bootstrap">bootstrap-static</option><option value="fixtures">fixtures</option><option value="live">live</option></select><textarea value={paste} onChange={e=>setPaste(e.target.value)} rows="4" style={{width:"100%",margin:"8px 0"}}/><Btn f={doPaste}>Apply pasted JSON</Btn></div></>}
  {sub==="req"&&<><div className="card scroll"><h3>Deposits</h3><table><tbody>{users.flatMap(u=>u.st.deposits.map(d=>({u,d}))).sort((a,b)=>b.d.d-a.d.d).map(({u,d})=><tr key={d.id}><td>{u.st.name}</td><td>{naira(d.a)}</td><td><button className="b g" onClick={()=>viewRc(u.uid,d)}>Receipt</button></td><td>{d.status}</td><td>{d.status==="pending"&&<div className="row"><button className="b" onClick={()=>dep(u.uid,d.id,true)}>Approve</button><button className="b r" onClick={()=>dep(u.uid,d.id,false)}>Reject</button></div>}</td></tr>)}</tbody></table></div>
    <div className="card scroll"><h3>Withdrawals</h3><table><tbody>{users.flatMap(u=>u.st.withdrawals.map(w=>({u,w}))).sort((a,b)=>b.w.d-a.w.d).map(({u,w})=><tr key={w.id}><td>{u.st.name}</td><td>{naira(w.a)}</td><td>{w.dest} {w.bank} {w.acct} {w.nm}</td><td>{w.status}</td><td><div className="row">{w.status==="pending"&&<button className="b" onClick={()=>wdr(u.uid,w.id,"approve")}>Approve</button>}{w.status==="approved"&&<button className="b y" onClick={()=>wdr(u.uid,w.id,"paid")}>Mark paid</button>}{(w.status==="pending"||w.status==="approved")&&<button className="b r" onClick={()=>wdr(u.uid,w.id,"reject")}>Reject</button>}</div></td></tr>)}</tbody></table></div></>}
  {sub==="users"&&<div className="card scroll"><h3>Ballers ({users.length})</h3><table><tbody>{users.map(u=><tr key={u.uid}><td>{u.st.name}<div className="mute">{u.st.email}</div></td><td>{naira(u.st.wallet)}</td><td><button className={"b "+(u.st.suspended?"y":"r")} onClick={()=>mod(u.uid,s=>{s.suspended=!s.suspended;return s})}>{u.st.suspended?"Unsuspend":"Suspend"}</button></td></tr>)}</tbody></table></div>}
  {sub==="gw"&&<><div className="card"><h3>Active Gameweek</h3><label>Gameweek number</label><input type="number" value={cfg.gw} onChange={e=>saveCfg({...cfg,gw:+e.target.value})}/>
    <label>First match kick-off (teams lock 30 min before)</label><input type="datetime-local" value={cfg.kickoff?toLocal(cfg.kickoff):""} onChange={e=>e.target.value&&saveCfg({...cfg,kickoff:new Date(e.target.value).toISOString()})}/>
    <label>Max players per club</label><input type="number" value={cfg.maxClub} onChange={e=>saveCfg({...cfg,maxClub:+e.target.value||2})}/></div>
    <div className="card scroll"><h3>All Gameweeks</h3><p className="mute">Auto-published 14 days before the first match. Hide any you want to hold back.</p><table><tbody>{D.gws.map(g=><tr key={g.id}><td>GW {g.id}</td><td>{g.kick?new Date(g.kick).toLocaleString():"no fixtures yet"}</td><td>{g.finished?"finished":""}</td><td><div className="row"><button className="b g" onClick={()=>saveCfg({...cfg,gw:g.id,kickoff:g.kick||""})}>Set active</button><button className="b g" onClick={()=>saveCfg({...cfg,hidden:{...cfg.hidden,[g.id]:!cfg.hidden[g.id]}})}>{cfg.hidden[g.id]?"Show":"Hide"}</button></div></td></tr>)}</tbody></table></div></>}
  {sub==="price"&&<><div className="card scroll"><h3>Player prices (₦M) &amp; availability</h3><input placeholder="Search player or club" value={q} onChange={e=>setQ(e.target.value)}/><table><tbody>{P.filter(p=>(p.name+p.club).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.pts-a.pts).slice(0,50).map(p=><tr key={p.id}><td>{p.name}<div className="mute">{p.club}{cfg.manual[p.id]?" · manual":""}</div></td><td><input type="number" step="0.1" defaultValue={p.price} style={{width:80}} onBlur={e=>setPrice(p,e.target.value)}/></td><td><label style={{fontWeight:400}}><input type="checkbox" style={{width:"auto"}} checked={!!cfg.out[p.id]} onChange={e=>saveCfg({...cfg,out:{...cfg.out,[p.id]:e.target.checked}})}/> out</label></td></tr>)}</tbody></table></div>
    <div className="card scroll"><h3>Price history</h3><table><tbody>{(cfg.priceLog||[]).map((l,i)=><tr key={i}><td>{l.name}</td><td>{l.prev} → {l.now}</td><td>{l.diff>0?"+":""}{l.diff}</td><td>{new Date(l.d).toLocaleDateString()}{l.auto?" auto":""}</td></tr>)}</tbody></table></div></>}
  {sub==="score"&&<div className="card scroll"><h3>Correct entry points (GW {cfg.gw})</h3><p className="mute">Corrected entries are protected from automatic recalculation.</p><table><tbody>{gwRows.map(({u,e})=><tr key={e.id}><td>{e.team}<div className="mute">{u.st.name} · {e.level}{e.adj?" · corrected":""}</div></td><td><input type="number" defaultValue={e.pts} style={{width:80}} onBlur={ev=>+ev.target.value!==e.pts&&setPts(u.uid,e.id,ev.target.value)}/></td></tr>)}</tbody></table>
    <h3 style={{marginTop:12}}>Change log</h3>{(cfg.scoreLog||[]).map((l,i)=><div key={i} className="mute">{new Date(l.d).toLocaleString()} – entry {l.entry} set to {l.pts}</div>)}</div>}
  {sub==="prize"&&<><div className="card"><h3>Winners – GW {cfg.gw}</h3><p className="mute">Run “Recalculate &amp; publish” first so points are current. Confirm about 1 hour after the last match. {ready?"Ready to approve.":"Matches may still be in progress."}</p></div>
    {lvl.map(x=><div key={x.L.id} className="card scroll"><h3>{x.L.id}</h3><p>{x.es.length} entries · fees {naira(x.es.length*x.L.fee)} · prize pool {naira(x.pool)} · revenue {naira(x.gross-x.pool)}</p>
      <label>Guaranteed minimum pool (₦)</label><input type="number" defaultValue={(cfg.minPool||{})[x.L.id]||""} onBlur={e=>saveCfg({...cfg,minPool:{...cfg.minPool,[x.L.id]:+e.target.value||0}})}/>
      <table><tbody>{x.es.slice(0,10).map(r=><tr key={r.id}><td>{r.u.st.name} – {r.e.team}</td><td>{r.pts} pts</td><td>{x.d[r.id]?naira(x.d[r.id]):""}</td></tr>)}</tbody></table>
      {x.done?<p className="ok">Prizes credited {new Date(x.done.t).toLocaleString()} ({naira(x.done.total)}).</p>:<button className="b y" disabled={busy||!x.es.length} onClick={()=>approve(x)}>Approve &amp; credit prizes</button>}</div>)}</>}
  {sub==="rep"&&<div className="card"><h3>Platform report</h3><table><tbody>{[["Ballers",users.length],["Deposits approved",naira(deps)],["Withdrawals paid",naira(wds)],["Entry fees (all time)",naira(fees)],["Prize pool share (57.5%)",naira(Math.round(fees*.575))],["Company revenue (42.5%)",naira(Math.round(fees*.425))],["Prizes credited",naira(won)],["Total in player wallets",naira(sum(s=>s.wallet))]].map(([a,b])=><tr key={a}><td>{a}</td><td><b>{b}</b></td></tr>)}</tbody></table></div>}
  </>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
