name: Update FPL data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and slim FPL data
        run: |
          mkdir -p fpl/gw
          UA="Mozilla/5.0 (compatible; OPlayingBot/1.0)"
          API=https://fantasy.premierleague.com/api
          curl -fsSL -A "$UA" $API/bootstrap-static/ -o raw_boot.json
          curl -fsSL -A "$UA" $API/fixtures/ -o raw_fix.json
          jq '{events:[.events[]|{id,deadline_time,finished,is_current,is_next,average_entry_score,highest_score,most_selected,most_captained,most_vice_captained,most_transferred_in,top_element,top_element_info}],
               teams:[.teams[]|{id,name,short_name,code}],
               elements:[.elements[]|{id,web_name,team,element_type,now_cost,form,total_points,selected_by_percent,status,news,news_added,chance_of_playing_next_round,transfers_in_event,transfers_out_event,minutes}]}' raw_boot.json > fpl/bootstrap.json
          jq '[.[]|{event,kickoff_time,team_h,team_a,started,finished,finished_provisional,minutes,team_h_score,team_a_score,team_h_difficulty,team_a_difficulty,stats:[(.stats // [])[]|select(.identifier|IN("goals_scored","assists","own_goals","yellow_cards","red_cards","penalties_saved","penalties_missed","bonus"))|{i:.identifier,a:[.a[]|{e:.element,v:.value}],h:[.h[]|{e:.element,v:.value}]}]}]' raw_fix.json > fpl/fixtures.json
          # Gameweek being played = latest Gameweek that already has a kicked-off match
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GW=$(jq --arg now "$NOW" '([.[]|select(.event!=null and .kickoff_time!=null and .kickoff_time<=$now)|.event]|max)' raw_fix.json)
          if [ -z "$GW" ] || [ "$GW" = "null" ]; then
            GW=$(jq '([.events[]|select(.is_current==true)][0].id) // ([.events[]|select(.finished==false)][0].id) // 38' raw_boot.json)
          fi
          echo "Live Gameweek: $GW"
          curl -fsSL -A "$UA" $API/event/$GW/live/ -o raw_live.json
          jq -n --argjson gw "$GW" --slurpfile d raw_live.json \
            '{gw:$gw, t:(now*1000|floor), data:{elements:[$d[0].elements[]|{id,stats:{minutes:.stats.minutes,goals_scored:.stats.goals_scored,assists:.stats.assists,clean_sheets:.stats.clean_sheets,yellow_cards:.stats.yellow_cards,red_cards:.stats.red_cards,own_goals:.stats.own_goals,penalties_saved:.stats.penalties_saved,bonus:.stats.bonus,starts:.stats.starts}}]}}' > fpl/live.json
          # history: one small file per Gameweek (finished weeks are fetched only once)
          for n in $(seq 1 $GW); do
            if [ ! -s fpl/gw/$n.json ] || [ "$n" -ge "$((GW-1))" ]; then
              curl -fsSL -A "$UA" $API/event/$n/live/ -o raw_gw.json || continue
              jq '[.elements[]|select(.stats.minutes>0)|{key:(.id|tostring),value:[.stats.minutes,.stats.goals_scored,.stats.assists,.stats.clean_sheets,.stats.yellow_cards,.stats.red_cards,.stats.own_goals,.stats.penalties_saved,.stats.bonus]}]|from_entries' raw_gw.json > fpl/gw/$n.json
            fi
          done
          jq -n 'reduce inputs as $d ({}; .[(input_filename|capture("(?<n>[0-9]+)\\.json$").n)]=$d)' fpl/gw/*.json > fpl/hist.json
          rm -f raw_boot.json raw_fix.json raw_live.json raw_gw.json

      - name: Download latest football headlines
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, html
          from email.utils import parsedate_to_datetime
          feeds = [("BBC Sport", "https://feeds.bbci.co.uk/sport/football/premier-league/rss.xml"),
                   ("Sky Sports", "https://www.skysports.com/rss/12040")]
          items = []
          for src, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  root = ET.fromstring(urllib.request.urlopen(req, timeout=20).read())
                  for it in root.iter("item"):
                      t = (it.findtext("title") or "").strip()
                      l = (it.findtext("link") or "").strip()
                      d = (it.findtext("pubDate") or "").strip()
                      if not (t and l):
                          continue
                      try:
                          ts = int(parsedate_to_datetime(d).timestamp())
                      except Exception:
                          ts = 0
                      items.append({"s": src, "t": html.unescape(t), "l": l, "ts": ts})
              except Exception as e:
                  print("feed failed:", url, e)
          items.sort(key=lambda i: -i["ts"])
          with open("fpl/news.json", "w", encoding="utf-8") as f:
              json.dump(items[:30], f, ensure_ascii=False)
          PY

      - name: Commit if changed
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add fpl
          git diff --cached --quiet || (git commit -m "Update FPL data" && git push)
