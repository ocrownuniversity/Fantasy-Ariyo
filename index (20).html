/* ================= RULES ENGINE ================= */
function playerPoints(pos,s,captain){ // s: {min,goals,assists,cs,yc,rc,og,pensSaved,postponed}
  if(s.postponed) return captain?2:1;
  if(!s.min) return 0;

/* Transfers (FPL style): 1 free transfer per Gameweek, unused ones roll over (max 5). Extra transfers cost 4 points each. Wildcard / Free Hit = unlimited free transfers. Free Hit team reverts next week. First team is free to build. */
function tfState(entries,gw){let base=null,baseE=null,free=1,lastE=null;const gs=[...new Set(entries.map(e=>e.gw))].sort((a,b)=>a-b);if(!gs.length||gs[0]>=gw)return{base:null,baseE:null,free:1,lastE:null};
  for(let h=gs[0];h<gw;h++){const es=entries.filter(e=>e.gw===h);
    if(es.length){const l=es.reduce((a,b)=>a.d>b.d?a:b);lastE=l;
      if(!base){base=l.ids;baseE=l;free=1}
      else{const used=(l.chip==="wc"||l.chip==="fh")?0:Math.min(free,l.ids.filter(i=>!base.includes(i)).length);free=Math.min(5,Math.max(free-used,0)+1);if(l.chip!=="fh"){base=l.ids;baseE=l}}}
    else free=Math.min(5,free+1)}
  return{base,baseE,free,lastE}}
const hitFor=(e,all)=>{const tf=tfState(all,e.gw);if(!tf.base||e.chip==="wc"||e.chip==="fh")return 0;return Math.max(0,(e.ids||[]).filter(i=>!tf.base.includes(i)).length-tf.free)*4};
const formOK=l=>{const c={GK:0,DEF:0,MID:0,FWD:0};l.forEach(id=>{const p=PLAYERS.find(x=>x.id===id);if(p)c[p.pos]++});return l.length===11&&c.GK===1&&c.DEF>=3&&c.MID>=2&&c.FWD>=1};
const orderedBn=(ids,xi,bn)=>{const rest=(ids||[]).filter(i=>!(xi||[]).includes(i)),keep=(bn||[]).filter(i=>rest.includes(i)),all=[...keep,...rest.filter(i=>!keep.includes(i))],isGK=i=>(PLAYERS.find(x=>x.id===i)||{}).pos==="GK";return[...all.filter(isGK),...all.filter(i=>!isGK(i))]};
const didPlay=(id,live)=>{const s=live&&live.stats&&live.stats[id];return !!(s&&s[0]>0)};
const gone=(id,e,live)=>{if(didPlay(id,live))return false;const p=PLAYERS.find(x=>x.id===id);if(!p)return true;const t=fxState(p.club,e.gw);return t==="done"||t===null};
/* Auto-substitutions: a starter who did not play (match finished) is replaced by the first bench player, in bench order, who played and keeps the formation valid. GK only for GK. */
function autoSub(e,live){let xi=[...(e.xi||[])];const bn=orderedBn(e.ids,e.xi,e.bn),used=[],pairs=[];

      st.entries.forEach(e=>{if(!(e.adj&&(cfg.scoreLog||[]).some(l=>l.entry===e.id))&&e.gw===lvd.gw){const p=entryPts(e,lvd);if(p!==e.pts){e.pts=p;ch=true;n++}}tot[st.name]=(tot[st.name]||0)+(e.pts||0);ptsU[u.uid]=(ptsU[u.uid]||0)+(e.pts||0);if(e.gw===lvd.gw)R.push({id:e.id,uid:u.uid,baller:st.name,team:e.team,level:e.level,pts:e.pts||0})});
      sts.push({uid:u.uid,st,ch})}
    const gdocs=await API.generalAll(lvd.gw),gmap={};gdocs.forEach(g=>gmap[g.uid]=g);
    for(const u of all){if(gmap[u.uid])continue;const pv=await prevGen(u.uid,lvd.gw);if(!pv)continue;const nd={...pv,gw:lvd.gw,name:u.st.name,team:teamName(u.st),carried:true,chip:null,d:Date.now(),...genCalc({ids:pv.ids,gw:lvd.gw},pv)};await API.putGeneral(u.uid+"_"+lvd.gw,nd);gmap[u.uid]=nd}
    const cur={};for(const g0 of Object.values(gmap)){let g=g0;const sx=sts.find(q=>q.uid===g.uid);
      if(g.chip&&sx){const cu=sx.st.chipsUsed||{},key=g.chip+"|"+half(g.gw),ec=(sx.st.entries.find(e=>e.gw===g.gw&&e.chip)||{}).chip;
        if((cu[key]!==undefined&&cu[key]!==g.gw)||(ec&&ec!==g.chip)){g={...g,chip:null};await API.putGeneral(g.uid+"_"+g.gw,g)}
        else if(cu[key]!==g.gw){sx.st.chipsUsed={...cu,[key]:g.gw};sx.ch=true}}
      if(!g.carried){const pv=await prevGen(g.uid,lvd.gw),c=genCalc(g,pv);if(c.mk!==(g.mk||0)||c.ft!==(g.ft||1)||c.hit!==(g.hit||0)){g={...g,...c};await API.putGeneral(g.uid+"_"+g.gw,g)}}cur[g.uid]=entryPts(g,lvd)}
    await API.setDoc("gen_"+lvd.gw,{pts:cur,t:Date.now()});
    {const cn={},cc={};Object.values(gmap).forEach(g=>{(g.ids||[]).forEach(i=>cn[i]=(cn[i]||0)+1);if(g.cap)cc[g.cap]=(cc[g.cap]||0)+1});const top=m=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,c])=>({id,c}));
      await API.setDoc("gen_stats",{gw:lvd.gw,picked:top(cn),cap:top(cc),n:Object.keys(gmap).length,t:Date.now()})}
    const gtot={};for(let h=1;h<=lvd.gw;h++){const d=h===lvd.gw?{pts:cur}:await API.doc("gen_"+h,{pts:{}});Object.entries(d.pts||{}).forEach(([k,v])=>gtot[k]=(gtot[k]||0)+v)}
    const garr=Object.entries(gtot).sort((a,b)=>b[1]-a[1]),grank={};garr.forEach(([k,v],i)=>{grank[k]=i&&garr[i-1][1]===v?grank[garr[i-1][0]]:i+1});
    const byU={};all.forEach(u=>byU[u.uid]=u.st);const prevOf=k=>{const u=byU[k];return u?(u.rankGw!==lvd.gw?u.genRank:u.prevGenRank)||0:0};
    await API.setDoc("gen_total",{pts:gtot,gw:lvd.gw,t:Date.now()});
    {const rowsOf=arr=>arr.map(([k])=>({uid:k,team:byU[k]?teamName(byU[k]):"Baller",name:(byU[k]||{}).name||"",p:cur[k]||0,t:gtot[k]||0,pr:prevOf(k)}));
      await API.setDoc("gen_lb",{gw:lvd.gw,byTot:rowsOf(garr.slice(0,300)),byGw:rowsOf(Object.entries(cur).sort((a,b)=>b[1]-a[1]).slice(0,300)),n:garr.length,t:Date.now()})}
    await API.setDoc("gen_top",{top:garr.slice(0,100).map(([k,v])=>({uid:k,pts:v,rank:grank[k],name:(byU[k]||{}).name||"",team:byU[k]?teamName(byU[k]):"Baller"})),n:garr.length,gw:lvd.gw,t:Date.now()});
    const pubG={},pubRank={};all.forEach(u=>{[["c",u.st.country],["f",u.st.favClub]].forEach(([t,k])=>{if(k){const key=(t+":"+k).replace(/\./g,"_");(pubG[key]=pubG[key]||[]).push(u.uid)}})});
    const pubOut={};Object.entries(pubG).forEach(([key,us])=>{const rows=us.map(k=>({uid:k,team:byU[k]?teamName(byU[k]):"Baller",name:(byU[k]||{}).name||"",p:cur[k]||0,t:gtot[k]||0})).sort((a,b)=>b.t-a.t);rows.forEach(r=>{(pubRank[r.uid]=pubRank[r.uid]||{})[key]={r:rows.findIndex(x=>x.t===r.t)+1,n:rows.length}});pubOut[key]={n:rows.length,top:rows.slice(0,50)}});
    await API.setDoc("pub_leagues",{gw:lvd.gw,leagues:pubOut,t:Date.now()});
    for(const x of sts){const pr0=pubRank[x.uid];if(pr0&&JSON.stringify(pr0)!==JSON.stringify(x.st.pubRank||{})){x.st.pubRank=pr0;x.ch=true}}
    for(const x of sts){const r=grank[x.uid],p=gtot[x.uid];if(r&&(x.st.genRank!==r||x.st.genPts!==p||x.st.rankGw!==lvd.gw)){if(x.st.rankGw!==lvd.gw){if(x.st.genRank)x.st.prevGenRank=x.st.genRank;x.st.rankGw=lvd.gw}x.st.genRank=r;x.st.genPts=p;x.ch=true}if(x.ch)await API.save(x.uid,x.st)}
    R.sort((a,b)=>b.pts-a.pts);const overall=Object.entries(tot).map(([baller,pts])=>({baller,pts})).sort((a,b)=>b.pts-a.pts).slice(0,100);
    const gp=R.map(r=>r.pts);await API.setDoc("lbfull",{pts:ptsU,t:Date.now()});await API.setDoc("lb",{gw:lvd.gw,rows:R.slice(0,300),overall,avg:gp.length?Math.round(gp.reduce((a,b)=>a+b,0)/gp.length):0,hi:gp.length?Math.max(...gp):0,n:gp.length,t:Date.now()});await reload();await load();await logA("Leaderboard published","GW "+lvd.gw+" · "+n+" entries recalculated");return "Recalculated "+n+" entries and published the leaderboard."});
  const autoPrice=()=>run(async()=>{const mv=priceMoves(P,cfg);if(!mv.length)return "No price changes today (not enough data or no player met the rules).";
    const prices={...cfg.prices},log=[...(cfg.priceLog||[])];mv.forEach(({p,d})=>{const nw=+(p.price+d).toFixed(1);prices[p.id]=nw;log.unshift({id:p.id,name:p.name,prev:p.price,now:nw,diff:d,d:Date.now(),auto:true})});
    await saveCfg({...cfg,prices,priceLog:log.slice(0,300)});return mv.length+" prices changed ("+mv.filter(x=>x.d>0).length+" up, "+mv.filter(x=>x.d<0).length+" down)."});
  /* requests */
  const setPrice=(p,v)=>{v=+v;if(!v||v===p.price)return;const log=[{id:p.id,name:p.name,prev:p.price,now:v,diff:+(v-p.price).toFixed(1),d:Date.now()},...(cfg.priceLog||[])].slice(0,300);saveCfg({...cfg,prices:{...cfg.prices,[p.id]:v},manual:{...cfg.manual,[p.id]:true},priceLog:log});logA("Price changed",p.name+" "+p.price+" → "+v)};
  const setPts=(uid,id,v)=>{mod(uid,s=>{const e=s.entries.find(x=>x.id===id);e.pts=+v;e.adj=true;return s});logA("Score corrected","entry "+id+" set to "+v);saveCfg({...cfg,scoreLog:[{uid,entry:id,pts:+v,d:Date.now()},...(cfg.scoreLog||[])].slice(0,200)})};
  const rows=users.flatMap(u=>u.st.entries.map(e=>({u,e})));
  const gwRows=rows.filter(r=>r.e.gw===sgw);
  const T=[["home","Dashboard"],["data","Data"],["users","Users"],["gw","Gameweeks"],["price","Prices"],["score","Scoring"],["rep","Reports"],["audit","Audit log"]];
  const Btn=({f,children,y})=><button className={"b "+(y?"y":"")} disabled={busy} onClick={f}>{children}</button>;
  return <><h1>Super Admin</h1><div className="row" style={{marginBottom:10}}>{T.map(([k,l])=><button key={k} className={"b "+(sub===k?"":"g")} onClick={()=>{setSub(k);setFs("all");setFq("")}}>{l}</button>)}</div>
  {msg&&<div className="warn">{msg}</div>}
  {sub==="home"&&<>
    <div className="grid">
      <div className="card"><div className="mute">Ballers</div><div className="stat">{users.length}</div><div className="mute">{users.filter(u=>u.st.created>Date.now()-6048e5).length} new this week · {new Set(gwRows.map(r=>r.u.uid)).size} active in GW {sgw}</div></div>
      <div className="card"><div className="mute">Entries in GW {sgw}</div><div className="stat">{gwRows.length}</div><div className="mute">{LEVELS.map(L=>L.id+" "+gwRows.filter(r=>r.e.level===L.id).length).join(" · ")}</div></div>
    </div>
    <div className="card scroll"><h3>Players in each competition</h3>
      <table><thead><tr><th>Level</th><th>GW {cfg.gw} (next)</th>{sgw!==cfg.gw&&<th>GW {sgw} (live)</th>}</tr></thead><tbody>{LEVELS.map(L=>{const f=g=>{const es=rows.filter(r=>r.e.gw===g&&r.e.level===L.id);return es.length+" entries · "+new Set(es.map(r=>r.u.uid)).size+" players"};return <tr key={L.id}><td>{L.id}</td><td>{f(cfg.gw)}</td>{sgw!==cfg.gw&&<td>{f(sgw)}</td>}</tr>})}</tbody></table>
    </div>
  </>}
  {sub==="data"&&<><div className="card"><h3>Football data (free FPL API)</h3><p className="mute">{PLAYERS.length} players loaded · {D.gws.length} Gameweeks · live GW {sgw} · next GW {cfg.gw} · source: {D.src}. Imports keep your manual prices.</p>{D.src!=="GitHub auto-update"&&<div className="warn">Automatic data is not set up yet. Add the <b>fpl-data.yml</b> workflow to your GitHub repo (see instructions), run it once, and this page will fill itself with all EPL players.</div>}
    <div className="row"><Btn y f={publish}>Recalculate &amp; publish leaderboard</Btn><Btn f={()=>run(async()=>{await reload();return "Data reloaded. Live Gameweek: "+((D.live&&D.live.gw)||"none")})}>Reload data</Btn><Btn f={autoPrice}>Run price update</Btn></div></div>
    <div className="card"><h3>Announcement banner</h3><p className="mute">Shown at the top of every player's screen until they tap OK.</p><input value={annTxt} onChange={e=>setAnnTxt(e.target.value)} maxLength={140} placeholder="e.g. Deadline moved to Saturday 11:30"/><div className="row" style={{marginTop:8}}><Btn y f={()=>{saveCfg({...cfg,announce:{text:annTxt.trim(),t:Date.now()}});logA("Announcement banner",annTxt.trim())}}>Publish banner</Btn><Btn f={()=>{setAnnTxt("");saveCfg({...cfg,announce:null})}}>Remove banner</Btn></div></div>
    <div className="card"><h3>Manual backup: upload or paste JSON</h3><input type="file" accept=".json,application/json,text/plain" onChange={onFile}/><p className="mute">Open the FPL URL in your browser, copy all the text, paste here. bootstrap-static/ · fixtures/ · event/{"{gw}"}/live/ on fantasy.premierleague.com/api/</p>
      <select value={kind} onChange={e=>setKind(e.target.value)}><option value="bootstrap">bootstrap-static</option><option value="fixtures">fixtures</option><option value="live">live</option></select><textarea value={paste} onChange={e=>setPaste(e.target.value)} rows="4" style={{width:"100%",margin:"8px 0"}}/><Btn f={doPaste}>Apply pasted JSON</Btn></div></>}
  {sub==="users"&&<div className="card scroll"><h3>Ballers ({users.length})</h3><div className="row" style={{marginBottom:8}}><input placeholder="Search name, email or code" value={fq} onChange={e=>setFq(e.target.value)} style={{flex:2,minWidth:160}}/><select value={fs} onChange={e=>setFs(e.target.value)} style={{flex:1,minWidth:110}}>{[["all","All"],["suspended","Suspended"]].map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div><table><tbody>{users.filter(u=>mt(u.st.name+" "+u.st.email+" "+(u.st.refCode||""))&&(fs==="all"||(fs==="suspended"&&u.st.suspended))).map(u=><tr key={u.uid}><td>{u.st.name}<div className="mute">{u.st.email}</div></td><td><button className={"b "+(u.st.suspended?"y":"r")} onClick={async()=>{await mod(u.uid,s=>{s.suspended=!s.suspended;return s});logA(u.st.suspended?"Account unsuspended":"Account suspended",u.st.name+" · "+u.st.email)}}>{u.st.suspended?"Unsuspend":"Suspend"}</button></td></tr>)}</tbody></table></div>}
  {sub==="gw"&&<><div className="card"><h3>Active Gameweek</h3><label>Gameweek number</label><input type="number" value={cfg.gw} onChange={e=>saveCfg({...cfg,gw:+e.target.value,manualGw:true})}/>
    <label>First match kick-off (teams lock 30 min before)</label><input type="datetime-local" value={cfg.kickoff?toLocal(cfg.kickoff):""} onChange={e=>e.target.value&&saveCfg({...cfg,manualGw:true,kickoff:new Date(e.target.value).toISOString()})}/><button className="b g" style={{marginTop:8}} onClick={()=>saveCfg({...cfg,manualGw:false})}>Use automatic Gameweek</button>
    <label>Max players per club</label><input type="number" value={cfg.maxClub} onChange={e=>saveCfg({...cfg,maxClub:+e.target.value||3,maxClubSet:true})}/></div>
    <div className="card scroll"><h3>All Gameweeks</h3><p className="mute">Auto-published 14 days before the first match. Hide any you want to hold back.</p><table><tbody>{D.gws.map(g=><tr key={g.id}><td>GW {g.id}</td><td>{g.kick?new Date(g.kick).toLocaleString():"no fixtures yet"}</td><td>{g.finished?"finished":""}</td><td><div className="row"><button className="b g" onClick={()=>saveCfg({...cfg,gw:g.id,kickoff:g.kick||"",manualGw:true})}>Set active</button><button className="b g" onClick={()=>saveCfg({...cfg,hidden:{...cfg.hidden,[g.id]:!cfg.hidden[g.id]}})}>{cfg.hidden[g.id]?"Show":"Hide"}</button></div></td></tr>)}</tbody></table></div></>}
  {sub==="price"&&<><div className="card scroll"><h3>Player prices (£M) &amp; availability</h3><input placeholder="Search player or club" value={q} onChange={e=>setQ(e.target.value)}/><table><tbody>{P.filter(p=>(p.name+p.club).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.pts-a.pts).slice(0,50).map(p=><tr key={p.id}><td>{p.name}<div className="mute">{p.club}{cfg.manual[p.id]?" · manual":""}</div></td><td><input type="number" step="0.1" defaultValue={p.price} style={{width:80}} onBlur={e=>setPrice(p,e.target.value)}/></td><td><label style={{fontWeight:400}}><input type="checkbox" style={{width:"auto"}} checked={!!cfg.out[p.id]} onChange={e=>saveCfg({...cfg,out:{...cfg.out,[p.id]:e.target.checked}})}/> out</label></td></tr>)}</tbody></table></div>
    <div className="card scroll"><h3>Price history</h3><table><tbody>{(cfg.priceLog||[]).map((l,i)=><tr key={i}><td>{l.name}</td><td>{l.prev} → {l.now}</td><td>{l.diff>0?"+":""}{l.diff}</td><td>{new Date(l.d).toLocaleDateString()}{l.auto?" auto":""}</td></tr>)}</tbody></table></div></>}
  {sub==="score"&&<div className="card scroll"><h3>Correct entry points (GW {sgw})</h3><p className="mute">Corrected entries are protected from automatic recalculation.</p><table><tbody>{gwRows.map(({u,e})=><tr key={e.id}><td>{e.team}<div className="mute">{u.st.name} · {e.level}{e.adj?" · corrected":""}</div></td><td><input type="number" defaultValue={e.pts} style={{width:80}} onBlur={ev=>+ev.target.value!==e.pts&&setPts(u.uid,e.id,ev.target.value)}/></td></tr>)}</tbody></table>
    <h3 style={{marginTop:12}}>Change log</h3>{(cfg.scoreLog||[]).map((l,i)=><div key={i} className="mute">{new Date(l.d).toLocaleString()} – entry {l.entry} set to {l.pts}</div>)}</div>}
  {sub==="audit"&&<div className="card scroll"><div className="row sp"><h3>Audit log</h3><Btn f={()=>dl([["Time","Admin","Action","Detail"],...(aud||[]).map(a=>[new Date(a.t).toLocaleString(),a.who,a.action,a.detail])],"audit-log")}>Export CSV</Btn></div>
    <input placeholder="Search action, name or admin" value={fq} onChange={e=>setFq(e.target.value)} style={{margin:"8px 0"}}/>
    {aud===null?<p className="mute">Loading…</p>:<table><tbody>{aud.filter(a=>mt(a.action+" "+a.detail+" "+a.who)).map((a,i)=><tr key={i}><td>{new Date(a.t).toLocaleString()}</td><td>{a.action}<div className="mute">{a.detail}</div></td><td className="mute">{a.who}</td></tr>)}</tbody></table>}{aud&&!aud.length&&<p className="mute">No actions recorded yet.</p>}</div>}
  {sub==="rep"&&<><div className="card"><h3>Export to CSV</h3><p className="mute">Opens as a spreadsheet in Excel or Google Sheets.</p><div className="row">
    <Btn f={()=>dl([["Name","Email","Suspended","Joined"],...users.map(u=>[u.st.name,u.st.email,u.st.suspended?"yes":"no",u.st.created?new Date(u.st.created).toLocaleDateString():""])],"managers")}>Managers</Btn>
    <Btn f={()=>dl([["GW","Level","Team","Manager","Points","Transfer cost","Chip"],...rows.map(r=>[r.e.gw,r.e.level,r.e.team,r.u.st.name,r.e.pts||0,r.e.hit||0,r.e.chip||""])],"entries")}>Entries</Btn></div></div>
  <div className="card"><h3>Platform report</h3><table><tbody>{[["Players",users.length],["Teams entered (all time)",rows.length]].map(([a,b])=><tr key={a}><td>{a}</td><td><b>{b}</b></td></tr>)}</tbody></table></div></>}
  </>
}
ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App/></Boundary>);
</script>
