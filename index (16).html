Saka|Arsenal|MID|20;Palmer|Chelsea|MID|20;Salah|Liverpool|MID|24;Foden|Man City|MID|17;Bruno Fernandes|Man United|MID|18;Son|Tottenham|MID|17;Rice|Arsenal|MID|13;Mbeumo|Man United|MID|16;Gibbs-White|Nottm Forest|MID|13;Maddison|Tottenham|MID|14;Mac Allister|Liverpool|MID|13;Odegaard|Arsenal|MID|17;Enzo|Chelsea|MID|12.5;Doku|Man City|MID|12
Haaland|Man City|FWD|28;Isak|Newcastle|FWD|20;Watkins|Aston Villa|FWD|17;Havertz|Arsenal|FWD|15;Jackson|Chelsea|FWD|13;Solanke|Tottenham|FWD|14;Wood|Nottm Forest|FWD|12;Calvert-Lewin|Everton|FWD|10`;
const PLAYERS=SEED.split(/[;\n]/).filter(Boolean).map((s,i)=>{const[n,c,p,pr]=s.split("|");return{id:"p"+i,name:n,club:c,pos:p,price:+pr,form:0,pts:0,sel:0,st:"a",min:0,ti:0,to:0}});

/* ================= RULES ENGINE ================= */
function playerPoints(pos,s,captain){ // s: {min,goals,assists,cs,yc,rc,og,pensSaved,postponed}
  if(s.postponed) return captain?2:1;
  if(!s.min) return 0;
  let p=s.min>=60?2:1; p-=s.yc||0; p-=3*(s.rc||0); p-=2*(s.og||0);
  const g=pos==="FWD"?10:pos==="MID"?8:12, a=pos==="FWD"?5:6, cs=pos==="MID"?2:(pos==="DEF"||pos==="GK")?5:0;
  p+=g*(s.goals||0)+a*(s.assists||0)+(s.cs?cs:0)+(pos==="GK"?6*(s.pensSaved||0):0);
  p+=s.bonus||0;return captain?p*2:p;
}
function prizeTable(gross){return[.25,.10,.05,.025,.025,.025,.025,.025,.025,.025].map(r=>Math.round(gross*r))} // 25+10+5+7*2.5=57.5%
function distribute(scores,table){ // scores sorted desc [{id,pts}] -> prize per id; ties share combined prizes and skip occupied ranks
  const out={};let i=0;
  while(i<scores.length&&i<10){let j=i;while(j+1<scores.length&&scores[j+1].pts===scores[i].pts)j++;
    let pool=0;for(let k=i;k<=j&&k<10;k++)pool+=table[k]||0;const share=Math.floor(pool/(j-i+1));
    for(let k=i;k<=j;k++)out[scores[k].id]=share;i=j+1}
  return out;
}
const lineupOK=(ids,xi)=>{const c={GK:0,DEF:0,MID:0,FWD:0};xi.forEach(id=>c[PLAYERS.find(p=>p.id===id).pos]++);return xi.length===11&&c.GK===1&&c.DEF>=3&&c.MID>=2&&c.FWD>=1}


let FX=[];
const pp=(id,live,m)=>{const p=PLAYERS.find(x=>x.id===id),s=live&&live.stats&&live.stats[id];if(!(p&&s))return 0;return playerPoints(p.pos,{min:s[0],goals:s[1],assists:s[2],cs:s[3],yc:s[4],rc:s[5],og:s[6],pensSaved:s[7],bonus:s[8]||0},false)*(m===true?2:(m||1))};
const pdone=(p,gw)=>{const f=FX.filter(x=>x.gw===gw&&(x.h===p.club||x.a===p.club));return f.length>0&&f.every(x=>x.fin)};
const capOf=(e,live)=>{const p=PLAYERS.find(x=>x.id===e.cap),s=live&&live.stats&&live.stats[e.cap];return e.vc&&p&&(!s||!s[0])&&pdone(p,e.gw)?e.vc:e.cap};
const half=g=>g<=19?1:2;
const chipUsed=(entries,k,gw)=>entries.some(e=>e.chip===k&&half(e.gw)===half(gw));
/* Transfers (FPL style): 1 free transfer per Gameweek, unused ones roll over (max 5). Extra transfers cost 4 points each. Wildcard / Free Hit = unlimited free transfers. Free Hit team reverts next week. First team is free to build. */
function tfState(entries,gw){let base=null,baseE=null,free=1,lastE=null;const gs=[...new Set(entries.map(e=>e.gw))].sort((a,b)=>a-b);if(!gs.length||gs[0]>=gw)return{base:null,baseE:null,free:1,lastE:null};
  for(let h=gs[0];h<gw;h++){const es=entries.filter(e=>e.gw===h);
    if(es.length){const l=es.reduce((a,b)=>a.d>b.d?a:b);lastE=l;
      if(!base){base=l.ids;baseE=l;free=1}
      else{const used=(l.chip==="wc"||l.chip==="fh")?0:Math.min(free,l.ids.filter(i=>!base.includes(i)).length);free=Math.min(5,Math.max(free-used,0)+1);if(l.chip!=="fh"){base=l.ids;baseE=l}}}
    else free=Math.min(5,free+1)}
  return{base,baseE,free,lastE}}
const hitFor=(e,all)=>{const tf=tfState(all,e.gw);if(!tf.base||e.chip==="wc"||e.chip==="fh")return 0;return Math.max(0,(e.ids||[]).filter(i=>!tf.base.includes(i)).length-tf.free)*4};
const entryPts=(e,live)=>{const c=capOf(e,live),m=e.chip==="tc"?3:2,x=e.xi||[];let t=x.reduce((a,id)=>a+pp(id,live,id===c?m:1),0);if(e.chip==="bb")t+=(e.ids||[]).filter(id=>!x.includes(id)).reduce((a,id)=>a+pp(id,live,1),0);return t-(e.hit||0)};
const showPts=(e,live)=>e.adj?e.pts:(live&&live.gw===e.gw?entryPts(e,live):(e.pts||0));
const toLocal=s=>{const d=new Date(s);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
/* Free football data: official Fantasy Premier League public API (no key). It has no CORS header, so the browser reaches it via free CORS proxies; if all fail, admin can paste the JSON. */
async function fpl(path){const url="https://fantasy.premierleague.com/api/"+path;
  const px=[u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+u];
  for(const p of px){try{const r=await fetch(p(url));if(r.ok)return await r.json()}catch(e){}}
  throw Error("Free CORS proxies are unreachable right now. Use 'Paste JSON' below, or try again later.")}
function buildFpl(boot,fix,old=[]){const tn={},ts={};boot.teams.forEach(t=>{tn[t.id]=t.name;ts[t.id]=t.short_name});
  const list=boot.elements.map(e=>({id:"p"+e.id,name:e.web_name,club:tn[e.team],pos:["","GK","DEF","MID","FWD"][e.element_type],price:e.now_cost/10,form:+e.form,pts:e.total_points,sel:+e.selected_by_percent,st:e.status,ti:e.transfers_in_event,to:e.transfers_out_event,min:e.minutes,news:e.news||""}));
  const kick={},last={};(fix||[]).forEach(f=>{if(f.event&&f.kickoff_time){if(!kick[f.event]||f.kickoff_time<kick[f.event])kick[f.event]=f.kickoff_time;if(!last[f.event]||f.kickoff_time>last[f.event])last[f.event]=f.kickoff_time}});
  const gws=boot.events.map(ev=>{const o=old.find(x=>x.id===ev.id)||{};return{id:ev.id,deadline:ev.deadline_time,finished:ev.finished,kick:kick[ev.id]||o.kick||null,last:last[ev.id]||o.last||null}});
  const fx=(fix||[]).filter(f=>f.event).map(f=>({gw:f.event,k:f.kickoff_time,h:tn[f.team_h],a:tn[f.team_a],hc:ts[f.team_h],ac:ts[f.team_a],hd:f.team_h_difficulty,ad:f.team_a_difficulty,fin:!!f.finished,hs:f.team_h_score,as:f.team_a_score}));
  return{list,gws,fx}}
/* Price algorithm (documented): among players who have played, rise +0.1 if net transfers-in this round is in the top 5% and form is at/above median; fall -0.1 if net transfers are in the bottom 5% (negative) and form is at/below median. Manually edited prices are skipped. Uses real API fields only. */
function priceMoves(P,cfg){const act=P.filter(p=>p.min>0);if(act.length<20)return[];
  const nets=act.map(p=>p.ti-p.to).sort((a,b)=>a-b),hi=nets[Math.floor(nets.length*.95)],lo=nets[Math.floor(nets.length*.05)];
  const f=act.map(p=>p.form).sort((a,b)=>a-b),mid=f[Math.floor(f.length/2)];
  return P.filter(p=>p.min>0&&!(cfg.manual||{})[p.id]).map(p=>{const n=p.ti-p.to;let d=0;if(n>0&&n>=hi&&p.form>=mid)d=.1;else if(n<0&&n<=lo&&p.form<=mid&&p.price>3.5)d=-.1;return d?{p,d}:null}).filter(Boolean)}

/* ================= DATA LAYER (Firebase or demo) ================= */

    let d=draw();while(d.length>max&&(q>.31||w>400)){if(q>.31)q-=.1;else w=Math.round(w*.8);d=draw()}
    d.length>max?rej(Error("Image is too detailed to compress enough. Use a screenshot of the receipt.")):res(d)};img.onerror=()=>rej(Error("That file is not a valid image."));img.src=r.result};r.readAsDataURL(file)})}

function Auth({onDone}){

function Admin({cfg,setCfg,D,reload,user}){

  {sub==="req"&&<><div className="card row"><input placeholder="Search name, email or amount" value={fq} onChange={e=>setFq(e.target.value)} style={{flex:2,minWidth:160}}/><select value={fs} onChange={e=>setFs(e.target.value)} style={{flex:1,minWidth:110}}>{["all","pending","approved","rejected","paid"].map(x=><option key={x} value={x}>{x==="all"?"All statuses":x}</option>)}</select></div><div className="card scroll"><h3>Deposits</h3><table><tbody>{allD.filter(x=>(fs==="all"||x.d.status===fs)&&mt(x.u.st.name+" "+x.u.st.email+" "+x.d.a)).sort((a,b)=>b.d.d-a.d.d).map(({u,d})=><tr key={d.id}><td>{u.st.name}<div className="mute">{new Date(d.d).toLocaleDateString()}</div></td><td>{naira(d.a)}</td><td><button className="b g" onClick={()=>viewRc(u.uid,d)}>Receipt</button></td><td>{d.status}</td><td>{d.status==="pending"&&<div className="row"><button className="b" onClick={()=>dep(u.uid,d.id,true)}>Approve</button><button className="b r" onClick={()=>dep(u.uid,d.id,false)}>Reject</button></div>}</td></tr>)}</tbody></table></div>
    <div className="card scroll"><h3>Withdrawals</h3><table><tbody>{allW.filter(x=>(fs==="all"||x.w.status===fs)&&mt(x.u.st.name+" "+x.u.st.email+" "+x.w.a)).sort((a,b)=>b.w.d-a.w.d).map(({u,w})=><tr key={w.id}><td>{u.st.name}</td><td>{naira(w.a)}</td><td>{w.dest} {w.bank} {w.acct} {w.nm}</td><td>{w.status}</td><td><div className="row">{w.status==="pending"&&<button className="b" onClick={()=>wdr(u.uid,w.id,"approve")}>Approve</button>}{w.status==="approved"&&<button className="b y" onClick={()=>wdr(u.uid,w.id,"paid")}>Mark paid</button>}{(w.status==="pending"||w.status==="approved")&&<button className="b r" onClick={()=>wdr(u.uid,w.id,"reject")}>Reject</button>}</div></td></tr>)}</tbody></table></div></>}
  {sub==="users"&&<div className="card scroll"><h3>Ballers ({users.length})</h3><div className="row" style={{marginBottom:8}}><input placeholder="Search name, email or code" value={fq} onChange={e=>setFq(e.target.value)} style={{flex:2,minWidth:160}}/><select value={fs} onChange={e=>setFs(e.target.value)} style={{flex:1,minWidth:110}}>{[["all","All"],["suspended","Suspended"],["balance","Has balance"],["pending","Has pending"]].map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div><table><tbody>{users.filter(u=>mt(u.st.name+" "+u.st.email+" "+(u.st.refCode||""))&&(fs==="all"||(fs==="suspended"&&u.st.suspended)||(fs==="balance"&&u.st.wallet>0)||(fs==="pending"&&(u.st.deposits.some(d=>d.status==="pending")||u.st.withdrawals.some(w=>w.status==="pending"))))).map(u=><tr key={u.uid}><td>{u.st.name}<div className="mute">{u.st.email}</div></td><td>{naira(u.st.wallet)}</td><td><button className={"b "+(u.st.suspended?"y":"r")} onClick={async()=>{await mod(u.uid,s=>{s.suspended=!s.suspended;return s});logA(u.st.suspended?"Account unsuspended":"Account suspended",u.st.name+" · "+u.st.email)}}>{u.st.suspended?"Unsuspend":"Suspend"}</button></td></tr>)}</tbody></table></div>}
  {sub==="gw"&&<><div className="card"><h3>Active Gameweek</h3><label>Gameweek number</label><input type="number" value={cfg.gw} onChange={e=>saveCfg({...cfg,gw:+e.target.value,manualGw:true})}/>
    <label>First match kick-off (teams lock 30 min before)</label><input type="datetime-local" value={cfg.kickoff?toLocal(cfg.kickoff):""} onChange={e=>e.target.value&&saveCfg({...cfg,manualGw:true,kickoff:new Date(e.target.value).toISOString()})}/><button className="b g" style={{marginTop:8}} onClick={()=>saveCfg({...cfg,manualGw:false})}>Use automatic Gameweek</button>
    <label>Max players per club</label><input type="number" value={cfg.maxClub} onChange={e=>saveCfg({...cfg,maxClub:+e.target.value||2})}/></div>
    <div className="card"><h3>Deposit bank account (shown to Ballers)</h3>{[["bank","Bank name"],["acct","Account number"],["name","Account name"]].map(([k,l])=><div key={k}><label>{l}</label><input defaultValue={(cfg.bank||{})[k]||""} onBlur={e=>saveCfg({...cfg,bank:{...(cfg.bank||{bank:"",acct:"",name:""}),[k]:e.target.value.trim()}})}/></div>)}</div>
    <div className="card scroll"><h3>All Gameweeks</h3><p className="mute">Auto-published 14 days before the first match. Hide any you want to hold back.</p><table><tbody>{D.gws.map(g=><tr key={g.id}><td>GW {g.id}</td><td>{g.kick?new Date(g.kick).toLocaleString():"no fixtures yet"}</td><td>{g.finished?"finished":""}</td><td><div className="row"><button className="b g" onClick={()=>saveCfg({...cfg,gw:g.id,kickoff:g.kick||"",manualGw:true})}>Set active</button><button className="b g" onClick={()=>saveCfg({...cfg,hidden:{...cfg.hidden,[g.id]:!cfg.hidden[g.id]}})}>{cfg.hidden[g.id]?"Show":"Hide"}</button></div></td></tr>)}</tbody></table></div></>}
  {sub==="price"&&<><div className="card scroll"><h3>Player prices (₦M) &amp; availability</h3><input placeholder="Search player or club" value={q} onChange={e=>setQ(e.target.value)}/><table><tbody>{P.filter(p=>(p.name+p.club).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.pts-a.pts).slice(0,50).map(p=><tr key={p.id}><td>{p.name}<div className="mute">{p.club}{cfg.manual[p.id]?" · manual":""}</div></td><td><input type="number" step="0.1" defaultValue={p.price} style={{width:80}} onBlur={e=>setPrice(p,e.target.value)}/></td><td><label style={{fontWeight:400}}><input type="checkbox" style={{width:"auto"}} checked={!!cfg.out[p.id]} onChange={e=>saveCfg({...cfg,out:{...cfg.out,[p.id]:e.target.checked}})}/> out</label></td></tr>)}</tbody></table></div>
    <div className="card scroll"><h3>Price history</h3><table><tbody>{(cfg.priceLog||[]).map((l,i)=><tr key={i}><td>{l.name}</td><td>{l.prev} → {l.now}</td><td>{l.diff>0?"+":""}{l.diff}</td><td>{new Date(l.d).toLocaleDateString()}{l.auto?" auto":""}</td></tr>)}</tbody></table></div></>}
  {sub==="score"&&<div className="card scroll"><h3>Correct entry points (GW {sgw})</h3><p className="mute">Corrected entries are protected from automatic recalculation.</p><table><tbody>{gwRows.map(({u,e})=><tr key={e.id}><td>{e.team}<div className="mute">{u.st.name} · {e.level}{e.adj?" · corrected":""}</div></td><td><input type="number" defaultValue={e.pts} style={{width:80}} onBlur={ev=>+ev.target.value!==e.pts&&setPts(u.uid,e.id,ev.target.value)}/></td></tr>)}</tbody></table>
    <h3 style={{marginTop:12}}>Change log</h3>{(cfg.scoreLog||[]).map((l,i)=><div key={i} className="mute">{new Date(l.d).toLocaleString()} – entry {l.entry} set to {l.pts}</div>)}</div>}
  {sub==="audit"&&<div className="card scroll"><div className="row sp"><h3>Audit log</h3><Btn f={()=>dl([["Time","Admin","Action","Detail"],...(aud||[]).map(a=>[new Date(a.t).toLocaleString(),a.who,a.action,a.detail])],"audit-log")}>Export CSV</Btn></div>
    <input placeholder="Search action, name or admin" value={fq} onChange={e=>setFq(e.target.value)} style={{margin:"8px 0"}}/>
    {aud===null?<p className="mute">Loading…</p>:<table><tbody>{aud.filter(a=>mt(a.action+" "+a.detail+" "+a.who)).map((a,i)=><tr key={i}><td>{new Date(a.t).toLocaleString()}</td><td>{a.action}<div className="mute">{a.detail}</div></td><td className="mute">{a.who}</td></tr>)}</tbody></table>}{aud&&!aud.length&&<p className="mute">No actions recorded yet.</p>}</div>}
  {sub==="prize"&&<><div className="card"><h3>Winners – GW {sgw}</h3><p className="mute">Run “Recalculate &amp; publish” first so points are current. Confirm about 1 hour after the last match. {ready?"Ready to approve.":"Matches may still be in progress."}</p></div>
    {lvl.map(x=><div key={x.L.id} className="card scroll"><h3>{x.L.id}</h3><p>{x.es.length} entries · fees {naira(x.es.length*x.L.fee)} · prize pool {naira(x.pool)} · revenue {naira(x.gross-x.pool)}</p>
      <label>Guaranteed minimum pool (₦)</label><input type="number" defaultValue={(cfg.minPool||{})[x.L.id]||""} onBlur={e=>saveCfg({...cfg,minPool:{...cfg.minPool,[x.L.id]:+e.target.value||0}})}/>
      <table><tbody>{x.es.slice(0,10).map(r=><tr key={r.id}><td>{r.u.st.name} – {r.e.team}</td><td>{r.pts} pts</td><td>{x.d[r.id]?naira(x.d[r.id]):""}</td></tr>)}</tbody></table>
      {x.done?<p className="ok">Prizes credited {new Date(x.done.t).toLocaleString()} ({naira(x.done.total)}).</p>:<button className="b y" disabled={busy||!x.es.length} onClick={()=>approve(x)}>Approve &amp; credit prizes</button>}</div>)}</>}
  {sub==="rep"&&<><div className="card"><h3>Export to CSV</h3><p className="mute">Opens as a spreadsheet in Excel or Google Sheets.</p><div className="row">
    <Btn f={()=>dl([["Date","Name","Email","Amount","Status"],...allD.map(x=>[new Date(x.d.d).toLocaleString(),x.u.st.name,x.u.st.email,x.d.a,x.d.status])],"deposits")}>Deposits</Btn>
    <Btn f={()=>dl([["Date","Name","Email","Amount","Destination","Bank","Account","Account name","Status"],...allW.map(x=>[new Date(x.w.d).toLocaleString(),x.u.st.name,x.u.st.email,x.w.a,x.w.dest,x.w.bank,x.w.acct,x.w.nm,x.w.status])],"withdrawals")}>Withdrawals</Btn>
    <Btn f={()=>dl([["GW","Level","Position","Name","Team","Prize"],...(D.win||[]).map(w=>[w.gw,w.level,w.pos,w.name,w.team,w.prize])],"winners")}>Winners</Btn>
    <Btn f={()=>dl([["Name","Email","Wallet","Reserved","Suspended","Joined"],...users.map(u=>[u.st.name,u.st.email,u.st.wallet,u.st.reserved,u.st.suspended?"yes":"no",u.st.created?new Date(u.st.created).toLocaleDateString():""])],"ballers")}>Ballers</Btn>
    <Btn f={()=>dl([["GW","Level","Team","Baller","Points","Transfer cost","Chip","Fee"],...rows.map(r=>[r.e.gw,r.e.level,r.e.team,r.u.st.name,r.e.pts||0,r.e.hit||0,r.e.chip||"",r.e.fee||0])],"entries")}>Entries</Btn></div></div>
  <div className="card"><h3>Platform report</h3><table><tbody>{[["Ballers",users.length],["Deposits approved",naira(deps)],["Withdrawals paid",naira(wds)],["Entry fees (all time)",naira(fees)],["Prize pool share (57.5%)",naira(Math.round(fees*.575))],["Company revenue (42.5%)",naira(Math.round(fees*.425))],["Prizes credited",naira(won)],["Total in player wallets",naira(sum(s=>s.wallet))]].map(([a,b])=><tr key={a}><td>{a}</td><td><b>{b}</b></td></tr>)}</tbody></table></div></>}
  </>
}
ReactDOM.createRoot(document.getElementById("root")).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
